server.port=8082

# Daily contribution bonus batch: Citizen published submissions + approved Expert research articles.
app.bonus-points.citizen=5
app.bonus-points.expert=10
app.bonus-points.cron=0 5 0 * * *

# ===== Bien bi mat (mat khau DB, Gmail...) =====
# Doc them file .env nam canh pom.xml (neu co). File .env da duoc .gitignore bo qua,
# nen mat khau KHONG bao gio bi day len GitHub. Mau file: xem .env.example.
# "optional:" = khong co file .env thi van chay binh thuong (dung gia tri mac dinh ben duoi).
spring.config.import=optional:file:.env[.properties]

# ===== MySQL =====
# Doi gia tri sau dau ":" thanh user/mat khau MySQL tren may cau
# (hoac dat bien moi truong DB_USERNAME / DB_PASSWORD de khoi phai sua file)
spring.datasource.url=jdbc:mysql://localhost:3306/citizen_journalism?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sa123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tu tao/cap nhat bang tu cac class trong entity/
spring.jpa.hibernate.ddl-auto=update
# In cau SQL ra console: dat bien moi truong SHOW_SQL=true khi can xem
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.ai.google.genai.api-key=dummy-key-for-local-dev

# ===== Email (Gmail SMTP) =====
# Mac dinh MAIL_ENABLED=false: email (kem ma OTP) chi in ra console de test.
# Muon gui that: khai bao MAIL_ENABLED=true, MAIL_USERNAME=<gmail>, MAIL_PASSWORD=<App Password 16 ky tu>
# trong file .env (xem .env.example). KHONG ghi mat khau that vao file nay.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT (token dang nhap) =====
# Khoa bi mat de KY token, dai >= 32 ky tu. Khoa mac dinh duoi day CHI de chay thu tren may;
# khi trien khai that phai dat JWT_SECRET rieng trong file .env.
app.jwt.secret=${JWT_SECRET:dev-only-secret-tin-nong-dan-sinh-change-me-2026}
# Thoi han token: binh thuong 24 gio, tick "Ghi nho dang nhap" thi 7 ngay
app.jwt.expiration-hours=24
app.jwt.remember-me-days=7

# ===== Chong do mat khau =====
# Sai mat khau lien tiep 5 lan -> tam khoa dang nhap 15 phut
app.auth.max-login-attempts=5
app.auth.lock-minutes=15

# ===== Tai khoan quan tri (tu tao khi khoi dong neu chua co, xem AdminAccountInitializer) =====
# Mat khau KHONG ghi o day: khai bao ADMIN_PASSWORD (va ADMIN_EMAIL) trong file .env
app.admin.username=${ADMIN_USERNAME:Admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.phone=${ADMIN_PHONE:0900000000}

# ===== Upload file (anh dai dien, bang chung...) =====
# Thu muc luu file, tinh tu thu muc chay backend (citizen_journalism/uploads). Da duoc .gitignore bo qua.
app.upload.dir=uploads
# Gioi han CHUNG cua server; gioi han rieng tung loai (vd avatar 2MB, tu lieu khieu nai 50MB/tep) nam trong code service.
# max-request-size = tong dung luong 1 lan gui (form khieu nai toi da 10 tep).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

# ===== OTP =====
app.otp.ttl-seconds=300
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5

# ===== Tra cuu ho so bang ma + PIN (SubmissionTrackingService) =====
# Nhap sai PIN 5 lan lien tiep -> tam khoa tra cuu ho so do 15 phut (chong do ma PIN)
app.tracking.max-pin-attempts=5
app.tracking.lock-minutes=15

# ===== Dang ky Cong tac vien (ContributorApplicationService) =====
# Dieu kien: du tuoi toi thieu + diem uy tin toi thieu (kem ho so co CCCD, ngay sinh, dia chi)
app.contributor.min-age=18
app.contributor.min-reputation=80
