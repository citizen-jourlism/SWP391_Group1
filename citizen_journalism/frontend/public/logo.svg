<!--
  Logo "Tin Nóng Dân Sinh"
  - Nền: gradient chéo từ cam (#ffa04d -> #ff4500) sang đen (#4a1306 -> #050507)
  - Tia sét: "tin nóng", phản ứng nhanh
  - 2 vòng sóng: tiếp nhận & phát tin tới cộng đồng
  Dùng làm favicon (index.html) và logo trong giao diện (components/ui/Logo.jsx).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tin Nóng Dân Sinh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa04d"/>
      <stop offset="0.36" stop-color="#ff4500"/>
      <stop offset="0.72" stop-color="#4a1306"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <!-- Lớp sáng nhẹ phía trên để logo có chiều sâu -->
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Tia sét -->
  <path d="M296 64 L148 288 H244 L216 448 L368 216 H272 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>

  <!-- Sóng phát tin -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M372 100 A 48 48 0 0 1 420 148" stroke-width="22" opacity="0.95"/>
    <path d="M372 52 A 96 96 0 0 1 468 148" stroke-width="22" opacity="0.6"/>
  </g>
</svg>
